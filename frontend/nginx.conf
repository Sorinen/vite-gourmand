server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # En-tetes de securite (TLS/HSTS sont geres par le proxy en amont).
    # Declares au niveau server uniquement : un add_header dans une location
    # annulerait l'heritage de ceux-ci.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.zotpresta.re; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Seule exception aux fichiers caches : /.well-known/ (jamais de fallback SPA)
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Fichiers caches (.env, .git, .htaccess, ...) -> vrai 404
    location ~ /\. {
        return 404;
    }

    # Fichiers sensibles / internes -> vrai 404
    location ~* (?:^|/)(?:Dockerfile|docker-compose[^/]*|package(?:-lock)?\.json|vite\.config\.[a-z]+|jsconfig\.json|requirements\.txt)$ {
        return 404;
    }
    location ~* \.(?:php\d?|phtml|env|bak|backup|old|orig|save|swp|sql|zip|gz|tgz|tar|7z|rar|log|ini|conf|ya?ml|toml|lock|map|sh|py)$ {
        return 404;
    }

    # Fichier statique avec extension absent -> 404, pas de fallback SPA
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    # Routes du routeur Vue (sans extension)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
