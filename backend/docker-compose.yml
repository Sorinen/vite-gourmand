# DEVELOPPEMENT LOCAL UNIQUEMENT - ne pas utiliser en production.
# Les ports sont lies a 127.0.0.1 (numeros inchanges) pour ne pas exposer les bases sur le reseau.
# MongoDB n'a pas d'authentification ici : acceptable seulement tant que le port reste en 127.0.0.1.
# Pour tout autre usage, definir MONGO_INITDB_ROOT_USERNAME / MONGO_INITDB_ROOT_PASSWORD
# et utiliser mongodb://user:pass@host:27017/?authSource=admin dans MONGO_URL.

version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: vite_gourmand_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vite_gourmand
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: vite_gourmand_mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:

