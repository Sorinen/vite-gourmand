services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans l environnement}
      POSTGRES_DB: vite_gourmand
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/data_initiales.sql:/docker-entrypoint-initdb.d/init.sql

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vite_gourmand
      MONGO_URL: mongodb://mongo:27017
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY doit etre defini dans l environnement}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
    depends_on:
      - postgres
      - mongo

  frontend:
    build: ./frontend
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data: